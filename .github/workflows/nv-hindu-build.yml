name: nv-hindu-build

# Builds a hindu batch from its curated knowledge table inside the runner, installs
# the records, refreshes the tracker, and pushes to BOTH names-upgraded-v3 and main.
#
# Triggered by a push that changes upgrading/scripts/nv_build_trigger.txt, whose
# single line is:  <batch> <curated_module> <first> <last>
# The curated table is the source of truth, so only the (small) spec travels.

on:
  push:
    branches: [names-upgraded-v3]
    paths:
      - 'upgrading/scripts/nv_build_trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout names-upgraded-v3
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 0

      - name: Unpack toolchain
        run: |
          base64 -d upgrading/scripts/nv_hindu_toolchain.b64 | tar xzf - -C upgrading/scripts
          ls upgrading/scripts/

      - name: Read batch spec
        id: spec
        run: |
          read B C F L < upgrading/scripts/nv_build_trigger.txt
          echo "batch=$B" >> $GITHUB_OUTPUT
          echo "curated=$C" >> $GITHUB_OUTPUT
          echo "first=$F" >> $GITHUB_OUTPUT
          echo "last=$L" >> $GITHUB_OUTPUT
          echo "Building batch $B ($C) $F..$L"

      - name: Build records from the curated table
        run: python3 upgrading/scripts/hbuild_batch.py "${{ steps.spec.outputs.curated }}" out/hindu

      - name: Install records
        run: |
          mkdir -p upgrading/names_upgraded/hindu
          cp out/hindu/*.json upgrading/names_upgraded/hindu/
          ls upgrading/names_upgraded/hindu/ | wc -l

      - name: Refresh tracker
        run: python3 upgrading/scripts/hmerge_progress.py "${{ steps.spec.outputs.batch }}" "${{ steps.spec.outputs.first }}" "${{ steps.spec.outputs.last }}"

      - name: Commit
        run: |
          git config user.name "nameverse-bot"
          git config user.email "bot@nameverse.local"
          git add upgrading/names_upgraded/hindu upgrading/PROGRESS.json upgrading/PROGRESS.md
          git commit -m "NameVerse hindu batch ${{ steps.spec.outputs.batch }}: ${{ steps.spec.outputs.first }}..${{ steps.spec.outputs.last }} (100 names)" || echo "nothing to commit"

      - name: Push to names-upgraded-v3
        run: git push origin HEAD:names-upgraded-v3

      - name: Push to main
        run: git push origin HEAD:main || echo "main push skipped (not fast-forward)"

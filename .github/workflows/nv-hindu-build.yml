name: nv-hindu-build

# Builds hindu batches from their curated knowledge tables inside the runner,
# installs the records, refreshes the tracker, and pushes to BOTH
# names-upgraded-v3 and main.
#
# Triggered by a push that changes upgrading/scripts/nv_build_trigger.txt.
# Each non-comment line is:  <batch> <curated_module> <first> <last>
# All listed batches are built in ONE run, so a single push can carry many batches.

on:
  push:
    branches: [names-upgraded-v3]
    paths:
      - 'upgrading/scripts/nv_build_trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout names-upgraded-v3
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 0

      - name: Restore toolchain
        run: |
          set -e
          # Base toolchain: the verified archive from the batch-2 commit.
          git show 829859598:upgrading/scripts/nv_hindu_toolchain.b64 \
            | base64 -d | tar xzf - -C upgrading/scripts
          # Delta: every curated_hN/hglossN added since that commit.
          # Fetched from the published archive recorded in nv_hindu_delta_url.txt
          # (the file is the single source of truth for the delta location).
          DL="$(tr -d '\r\n' < upgrading/scripts/nv_hindu_delta_url.txt)"
          curl -fsSL -o /tmp/nv_delta.tar.gz "$DL"
          tar xzf /tmp/nv_delta.tar.gz -C upgrading/scripts
          ls upgrading/scripts/

      - name: Build every listed batch
        run: |
          set -e
          git config user.name "nameverse-bot"
          git config user.email "bot@nameverse.local"
          while read B C F L; do
            [ -z "$B" ] && continue
            case "$B" in \#*) continue;; esac
            echo "=== batch $B ($C) $F..$L ==="
            rm -rf out/hindu
            python3 upgrading/scripts/hbuild_batch.py "$C" out/hindu
            mkdir -p upgrading/names_upgraded/hindu
            cp out/hindu/*.json upgrading/names_upgraded/hindu/
            python3 upgrading/scripts/hmerge_progress.py "$B" "$F" "$L"
            git add upgrading/names_upgraded/hindu upgrading/PROGRESS.json upgrading/PROGRESS.md
            git commit -m "NameVerse hindu batch $B: $F..$L (100 names)" || echo "nothing to commit"
          done < upgrading/scripts/nv_build_trigger.txt
          echo "total hindu records:"
          ls upgrading/names_upgraded/hindu/ | wc -l

      - name: Refresh mirror (upgrading/upgrade_names_hindu)
        run: |
          set -e
          mkdir -p upgrading/upgrade_names_hindu
          cp -f upgrading/names_upgraded/hindu/*.json upgrading/upgrade_names_hindu/
          git add upgrading/upgrade_names_hindu
          git commit -m "Mirror hindu upgraded set into upgrade_names_hindu" || echo "nothing to mirror"

      - name: Push to names-upgraded-v3
        run: git push origin HEAD:names-upgraded-v3

      - name: Push to main
        run: git push origin HEAD:main || echo "main push skipped (not fast-forward)"
